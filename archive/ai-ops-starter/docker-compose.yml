# AI-OPS-STARTER — Brainiac 7 (Windows 11 Pro primary intellect node)
# No public ports: bind to localhost only. Use Tailscale for remote access.

name: ai-ops-starter

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: ai-ops-open-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPEN_WEBUI_PORT:-3000}:8080"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - WEBUI_AUTH=${WEBUI_AUTH:-true}
      - ENABLE_SIGNUP=${ENABLE_SIGNUP:-false}
      - WEBUI_NAME=${WEBUI_NAME:-Brainiac 7}
      - RAG_EMBEDDING_MODEL=${RAG_EMBEDDING_MODEL:-nomic-embed-text}
      - RAG_OLLAMA_BASE_URL=http://host.docker.internal:11434
      - ENABLE_OPENAI_API=${ENABLE_OPENAI_API:-false}
      - ENABLE_ANTHROPIC_API=${ENABLE_ANTHROPIC_API:-false}
      - ENABLE_GOOGLE_API=${ENABLE_GOOGLE_API:-false}
    volumes:
      - open-webui-data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant
    networks:
      - ai-ops-internal

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: ai-ops-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - ai-ops-internal

  n8n:
    image: n8nio/n8n:1.70.3
    container_name: ai-ops-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://127.0.0.1:${N8N_PORT:-5678}/
      - GENERIC_TIMEZONE=${TZ:-America/New_York}
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-true}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-changeme}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n:/import:ro
      - ./workflows:/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ai-ops-internal

  postgres:
    image: postgres:16-alpine
    container_name: ai-ops-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-n8n}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-n8n}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ai-ops-internal

  redis:
    image: redis:7-alpine
    container_name: ai-ops-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis-data:/data
    profiles:
      - optional
    networks:
      - ai-ops-internal

  # Optional: local speech-to-text (enable with: docker compose --profile optional up -d)
  faster-whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: ai-ops-faster-whisper
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WHISPER_PORT:-8000}:8000"
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
    volumes:
      - whisper-cache:/root/.cache
    profiles:
      - voice
      - optional
    networks:
      - ai-ops-internal

networks:
  ai-ops-internal:
    driver: bridge

volumes:
  open-webui-data:
  qdrant-data:
  n8n-data:
  postgres-data:
  redis-data:
