<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AIXMOS — For the people. By the people.</title>
  <style>
    :root { --blue: #1e3a8a; --cyan: #0891b2; --bg: #0f172a; --text: #f8fafc; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    main { max-width: 36rem; text-align: center; }
    h1 { font-size: 1.75rem; margin-bottom: 0.5rem; }
    p { opacity: 0.85; line-height: 1.6; }
    nav { margin-top: 2rem; display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
    a { color: var(--cyan); text-decoration: none; padding: 0.5rem 1rem; border: 1px solid var(--cyan); border-radius: 6px; }
    a:hover { background: rgba(8,145,178,0.15); }
    .note { margin-top: 2rem; font-size: 0.85rem; opacity: 0.6; }
  </style>
</head>
<body>
  <main>
    <h1>AIXMOS</h1>
    <p>Workforce infrastructure. Local server running from your USB drive.</p>
    <nav>
      <a href="/apply">Apply</a>

      <a href="/pipeline">Pipeline</a>
    </nav>

  </main>
</body>
</html>
