name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # vendor/ is gitignored; the app loads requests + pillow from it, exactly as the installer ships them
      - run: python -m pip install --quiet --target vendor requests pillow
      - run: python -m unittest discover -s tests -v
